<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GM Phaser 4 CDN Prototype</title>
    <link rel="stylesheet" href="./native-app-shell.css">
</head>
<body data-gm-app-shell="locked">
    <div class="gm-app-shell">
        <div id="game" class="gm-app-surface gm-app-safe-area"></div>
    </div>

    <!-- CDN/CDN-hosted fallback example. Host these locally for bundled preview drops. -->
    <script src="https://cdn.jsdelivr.net/gh/phaserjs/phaser@v4.2.1/dist/phaser.min.js"></script>

    <script>
        window.onerror = function (message) {
            const item = document.createElement("pre");
            item.style.color = "#fff";
            item.style.padding = "12px";
            item.style.margin = "0";
            item.textContent = String(message);
            document.body.appendChild(item);
        };

        (function () {
            const RUNTIME_VERSION = "0.1.0";

            function isTrustedRuntimeUrl(candidate) {
                try {
                    const url = new URL(candidate, window.location.href);
                    if (url.username || url.password || url.hash || url.search) return false;
                    if (url.origin === window.location.origin) {
                        return /gm-phaser4\.global(?:\.min)?\.js$/.test(url.pathname);
                    }
                    if (url.origin !== "https://cdn.jsdelivr.net") return false;
                    return /^\/gh\/Shoozes\/phaser4-facade@[^/]+\/dist\/gm-phaser4\.global(?:\.min)?\.js$/.test(url.pathname);
                } catch {
                    return false;
                }
            }

            const rawRuntimeOverride = new URL(window.location.href).searchParams.get("runtime");
            const runtimeOverride = rawRuntimeOverride && isTrustedRuntimeUrl(rawRuntimeOverride)
                ? rawRuntimeOverride
                : null;
            const runtimeCandidates = [
                runtimeOverride,
                "../dist/gm-phaser4.global.js",
                "../main-files/runtime/gm-phaser4/gm-phaser4.global.js",
                "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/dist/gm-phaser4.global.js"
            ].filter(function (candidate, index, candidates) {
                return candidate && candidates.indexOf(candidate) === index;
            });
            const SCRIPT_TIMEOUT_MS = 8000;
            let launched = false;

            function validateRuntime() {
                return Boolean(
                    window.Phaser &&
                    window.Phaser.Game &&
                    window.GM &&
                    window.GM.version === RUNTIME_VERSION &&
                    window.GM.app &&
                    typeof window.GM.app.start === "function" &&
                    window.GM.input &&
                    typeof window.GM.input.createVirtualStick === "function"
                );
            }

            function launchDemo() {
                if (launched) return;
                launched = true;

                const game = GM.app.start({
                    width: 720,
                    height: 1280,
                    responsive: true,
                    bleed: 300,
                    curtain: true,
                    globals: false,
                    create() {
                        GM.entity.spawn({
                            create() {
                                this.x = GM.runtime.roomWidth / 2;
                                this.y = GM.runtime.roomHeight / 2;
                                this.r = 60;
                            },

                            step() {
                                this.y = GM.runtime.roomHeight / 2 + Math.sin(GM.runtime.currentTime / 500) * 200;
                            },

                            draw() {
                                GM.draw.setColor(GM.color.LIME);
                                GM.draw.circle(this.x, this.y, this.r, false);
                            }
                        }, {
                            x: GM.runtime.roomWidth / 2,
                            y: GM.runtime.roomHeight / 2,
                            layer: "Instances"
                        });
                    }
                });

                if (GM.phaser.game !== game || !GM.phaser.library) {
                    throw new Error("GM.phaser runtime handles are not available.");
                }
            }

            function loadScriptCandidates(candidates, validate, onReady, onFail) {
                let index = 0;

                function tryNext() {
                    if (index >= candidates.length) {
                        onFail();
                        return;
                    }

                    const script = document.createElement("script");
                    let settled = false;
                    const timeout = window.setTimeout(function () {
                        finish(false);
                    }, SCRIPT_TIMEOUT_MS);

                    function finish(loaded) {
                        if (settled) return;
                        settled = true;
                        window.clearTimeout(timeout);

                        if (loaded) {
                            if (validate()) onReady();
                            else {
                                if (script.parentNode) script.parentNode.removeChild(script);
                                onFail(new Error("Loaded gm-phaser4 runtime failed its version/API validation."));
                            }
                            return;
                        }

                        if (script.parentNode) {
                            script.parentNode.removeChild(script);
                        }
                        tryNext();
                    }

                    script.src = candidates[index];
                    index += 1;
                    script.onload = function () {
                        finish(true);
                    };
                    script.onerror = function () {
                        finish(false);
                    };
                    document.head.appendChild(script);
                }

                tryNext();
            }

            loadScriptCandidates(
                runtimeCandidates,
                validateRuntime,
                launchDemo,
                function (error) {
                    throw error || new Error("Unable to load gm-phaser4 runtime.");
                }
            );
        }());
    </script>
</body>
</html>
