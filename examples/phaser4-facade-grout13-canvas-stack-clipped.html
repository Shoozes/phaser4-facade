<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phaser4 Facade + Grout13 Full-Canvas Stack</title>
</head>
<body>
<div id="game"></div>

<script type="importmap">
{
  "imports": {
    "phaser": "https://cdn.jsdelivr.net/gh/phaserjs/phaser@v4.2.1/dist/phaser.esm.js",
    "phaser4-facade": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@b4de179bb2e90593952136eef665f073cd02e1b3/dist/gm-phaser4.module.js",
    "phaser4-facade/grout13": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@b4de179bb2e90593952136eef665f073cd02e1b3/dist/gm-phaser4-grout13.module.js",
    "grout13": "https://cdn.jsdelivr.net/gh/Shoozes/grout13@dd41ded3a8bc1b11b3b733535688b03ef4984bce/dist/grout13.mjs",
    "fruit-shot/font-payload": "./fruit-shot/font-payload.js",
    "fruit-shot/atlas-payload": "./fruit-shot/canvas-stack-payload.js"
  }
}
</script>

<script type="module">
import { GM } from "phaser4-facade";
import { installGrout13Bridge } from "phaser4-facade/grout13";
import * as GROUT13 from "grout13";
import { PIXEL_FONT_PAYLOAD, PIXEL_FONT_GLYPHS, PIXEL_FONT_METRICS } from "fruit-shot/font-payload";
import { CANVAS_STACK_ATLAS_PAYLOAD } from "fruit-shot/atlas-payload";

const renderType = new URLSearchParams(window.location.search).get("render") === "canvas"
  ? "CANVAS"
  : "WEBGL";
installGrout13Bridge(GM, GROUT13);


const proof = globalThis.__canvasStackProof = {
  architecture:"single-canvas-stacked-planes",
  complete:false,
  failed:false,
  errors:[],
  generatedChecker:false,
  generatedFont:false,
  adaptiveCanvas:true,
  persistentUnderlay:true,
  persistentOverlay:true,
  cameraRoom:true,
  worldViewportClipped:true,
  clipMode:"portable-frame-cover",
  mode:"splash",
  paused:false,
  health:3,
  collection:0,
  droneCount:3,
  pulseCount:0,
  restarts:0,
  outcome:null,
  cameraMoved:false,
  joystickMoved:false,
  joystickPresses:0,
  joystickActive:false,
  joystickEnabled:false,
  inputBlocked:false,
  targetActive:false,
  joystickMagnitude:0,
  joystickOrigin:null,
  touchInput:false,
  touchPulse:false,
  pauseGesture:false,
  rendererType:null,
  render:renderType,
  pauseRect:null,
  continueRect:null,
  pulseRect:null,
  mouse:true,
  touch:true
};

const ATLAS = "canvas-stack-generated";
const FONT = "pixel-3x5";

const ROOM = Object.freeze({
  width:1280,
  height:1280,
  viewHeight:640,
  minAspect:9/16,
  maxAspect:1
});

const COLORS = Object.freeze({
  checkerA:0x101522,
  checkerB:0x182236,
  tint:"#52aee8",
  room:"#07101c",
  grid:"#17304a",
  border:"#d4e8ff",
  player:"#ffe35b",
  target:"#71f6ff"
});

const state = {
  mode:"splash",
  modeAge:0,
  paused:false,
  player:{x:ROOM.width/2,y:ROOM.height/2,px:ROOM.width/2,py:ROOM.height/2,r:24},
  target:{x:ROOM.width/2,y:ROOM.height/2,active:false},
  drones:[
    {x:ROOM.width/2-150,y:ROOM.height/2-90,phase:0,collected:false},
    {x:ROOM.width/2+150,y:ROOM.height/2-40,phase:2,collected:false},
    {x:ROOM.width/2,y:ROOM.height/2+150,phase:4,collected:false}
  ],
  health:3,
  collection:0,
  pulseAge:0,
  pulseCount:0,
  damageCooldown:0,
  outcome:null,
  restarts:0,
  camera:null,
  transition:{alpha:1,next:null,direction:-1},
  messageAge:0,
  cameraMoved:false,
  pausePointerId:null,
  resumePointerId:null,
  pulsePointerId:null
};

let movementJoystick = null;

function installGeneratedAssets(){
  GM.grout13.addPayload(ATLAS,CANVAS_STACK_ATLAS_PAYLOAD,{replace:true});

  GM.grout13.addFontPayload(FONT,PIXEL_FONT_PAYLOAD,PIXEL_FONT_GLYPHS,PIXEL_FONT_METRICS,{replace:true});

  proof.generatedChecker = GM.asset.frameExists(ATLAS,"checker");
  proof.generatedFont = Boolean(GM.grout13.getFont(FONT));
}

function beginTransition(next){
  if(state.transition.next) return;
  state.transition.next=next;
  state.transition.direction=1;
}

function setMode(next){
  clearControlGestures();
  state.mode=next;
  state.modeAge=0;
  state.paused=false;
  state.transition.next=null;
  state.transition.direction=-1;
  if(next==="game"){
    state.player.x=state.player.px=ROOM.width/2;
    state.player.y=state.player.py=ROOM.height/2;
    state.target.active=false;
    state.camera.cx=ROOM.width/2;
    state.camera.cy=ROOM.height/2;
    state.camera.clamp();
    state.target.active=false;
    state.health=3;
    state.collection=0;
    state.pulseAge=0;
    state.damageCooldown=0;
    state.outcome=null;
    state.drones.forEach((drone,index)=>{
      const angle=index*Math.PI*2/3;
      drone.x=ROOM.width/2+Math.cos(angle)*150;
      drone.y=ROOM.height/2+Math.sin(angle)*150;
      drone.phase=index*2;
      drone.collected=false;
    });
  }
  syncMovementControl();
  updateProof();
}

function controlsEnabled(){
  return state.mode==="game"&&
    !state.paused&&
    !state.transition.next&&
    state.transition.alpha<=0.08;
}

function clearControlGestures(){
  for(const pointerId of [state.pausePointerId,state.resumePointerId,state.pulsePointerId]){
    if(pointerId!==null&&pointerId!==undefined) GM.input.releasePointer(pointerId,"button");
  }
  state.pausePointerId=null;
  state.resumePointerId=null;
  state.pulsePointerId=null;
}

function syncMovementControl(){
  if(!movementJoystick) return;
  const enabled=controlsEnabled();
  movementJoystick.setEnabled(enabled);
  if(!enabled) movementJoystick.reset();
}

function rectContains(rect,x,y){
  return Boolean(rect)&&
    x>=rect.x&&
    x<=rect.x+rect.width&&
    y>=rect.y&&
    y<=rect.y+rect.height;
}

function pauseButtonRect(){
  const screen=GM.viewport.logicalRect;
  const pad=24;
  return {x:screen.width-pad-118,y:pad,width:118,height:54};
}

function continueButtonRect(){
  const screen=GM.viewport.logicalRect;
  return {x:screen.width/2-150,y:screen.height/2,width:300,height:84};
}

function pulseButtonRect(){
  const screen=GM.viewport.logicalRect;
  const pad=24;
  return {x:screen.width-pad-156,y:screen.height-pad-104,width:132,height:80};
}

function pointerId(pointer){
  return String(pointer?.id??pointer?.pointerId??"").trim();
}

function markTouch(pointer){
  if(pointer?.kind==="touch") proof.touchInput=true;
}

function captureButton(pointer){
  const id=pointerId(pointer);
  if(!id) return null;
  GM.input.capturePointer(id,"button");
  return id;
}

function releaseButton(pointer){
  const id=pointerId(pointer);
  if(id) GM.input.releasePointer(id,"button");
  return id;
}

function resumeFromPause(pointer){
  state.pausePointerId=null;
  state.resumePointerId=captureButton(pointer);
  state.paused=false;
  state.messageAge=0;
  proof.pauseGesture=true;
  syncMovementControl();
  updateProof();
}

function updateProof(){
  proof.mode=state.mode;
  proof.paused=state.paused;
  proof.health=state.health;
  proof.collection=state.collection;
  proof.pulseCount=state.pulseCount;
  proof.restarts=state.restarts;
  proof.outcome=state.outcome;
  proof.cameraMoved=proof.cameraMoved||state.cameraMoved;
  proof.joystickActive=Boolean(movementJoystick?.active);
  proof.joystickEnabled=Boolean(movementJoystick?.enabled);
  proof.inputBlocked=Boolean(GM.runtime.input_blocked?.());
  proof.targetActive=Boolean(state.target.active);
  proof.joystickMagnitude=Number(movementJoystick?.magnitude||0);
  proof.joystickOrigin=movementJoystick?.origin||null;
  proof.joystickMoved=proof.joystickMoved||Boolean(movementJoystick?.magnitude>0);
  proof.pauseRect=pauseButtonRect();
  proof.continueRect=continueButtonRect();
  proof.pulseRect=pulseButtonRect();
}

function restart(){
  clearControlGestures();
  state.restarts+=1;
  state.transition.alpha=0;
  state.transition.direction=1;
  state.transition.next="game";
  state.outcome=null;
  syncMovementControl();
  updateProof();
}

function finish(outcome){
  if(state.mode!=="game") return;
  clearControlGestures();
  state.outcome=outcome;
  state.mode="result";
  state.modeAge=0;
  state.paused=false;
  syncMovementControl();
  updateProof();
}

function stepTransition(dt){
  const transition=state.transition;
  const wasEnabled=controlsEnabled();
  transition.alpha=GM.math.clamp(
    transition.alpha+transition.direction*dt*3.2,
    0,
    1
  );
  if(transition.direction>0&&transition.alpha>=1&&transition.next){
    setMode(transition.next);
  }
  if(wasEnabled!==controlsEnabled()) syncMovementControl();
}

function updatePlayer(dt){
  const player=state.player;
  player.px=player.x;
  player.py=player.y;

  let dx=0;
  let dy=0;
  if(GM.input.keyDown(GM.key.LEFT)||GM.input.keyDown("A")) dx-=1;
  if(GM.input.keyDown(GM.key.RIGHT)||GM.input.keyDown("D")) dx+=1;
  if(GM.input.keyDown(GM.key.UP)||GM.input.keyDown("W")) dy-=1;
  if(GM.input.keyDown(GM.key.DOWN)||GM.input.keyDown("S")) dy+=1;

  const keyboardLength=Math.hypot(dx,dy);
  let analog=false;
  if(keyboardLength===0&&movementJoystick?.active){
    state.target.active=false;
  }
  if(keyboardLength===0&&movementJoystick?.active&&movementJoystick.magnitude>0){
    const vector=movementJoystick.vector;
    dx=vector.x;
    dy=vector.y;
    analog=true;
  }

  if(dx||dy){
    state.target.active=false;
  }else if(state.target.active){
    dx=state.target.x-player.x;
    dy=state.target.y-player.y;
    if(Math.hypot(dx,dy)<8){
      state.target.active=false;
      dx=dy=0;
    }
  }

  if(dx||dy){
    const direction=analog
      ? {x:dx,y:dy}
      : GM.math.normalize2(dx,dy);
    const speed=320;
    player.x+=direction.x*speed*dt;
    player.y+=direction.y*speed*dt;
  }

  player.x=GM.math.clamp(player.x,player.r,ROOM.width-player.r);
  player.y=GM.math.clamp(player.y,player.r,ROOM.height-player.r);
  state.camera.follow(player.x,player.y,dt);
  state.cameraMoved=state.cameraMoved||Math.abs(player.x-ROOM.width/2)>24||Math.abs(player.y-ROOM.height/2)>24;
  for(const drone of state.drones){
    if(drone.collected) continue;
    drone.phase+=dt*1.8;
    drone.x=GM.math.clamp(drone.x+Math.cos(drone.phase)*dt*18,48,ROOM.width-48);
    drone.y=GM.math.clamp(drone.y+Math.sin(drone.phase*1.2)*dt*18,48,ROOM.height-48);
    if(state.pulseAge>0&&Math.hypot(drone.x-player.x,drone.y-player.y)<220){
      drone.collected=true;
      state.collection+=1;
    }
  }
  state.damageCooldown=Math.max(0,state.damageCooldown-dt);
  if(state.damageCooldown===0&&Math.hypot(player.x-48,player.y-48)<86){
    state.damageCooldown=0.9;
    state.health=Math.max(0,state.health-1);
    if(state.health===0) finish("loss");
  }
  if(state.collection===state.drones.length) finish("win");
  state.pulseAge=Math.max(0,state.pulseAge-dt);
  updateProof();
}

function triggerPulse(){
  if(state.mode!=="game"||state.paused||state.pulseAge>0) return;
  state.pulseAge=0.55;
  state.pulseCount+=1;
  updateProof();
}

function drawUnderlay(){
  const D=GM.draw;
  const visible=GM.viewport.visibleRoomRect;
  const tileScale=4;
  const tileSize=32*tileScale;
  const drift=(GM.runtime.currentTime*0.012)%tileSize;
  const startX=Math.floor((visible.x-drift)/tileSize)*tileSize+drift;
  const startY=Math.floor((visible.y-drift)/tileSize)*tileSize+drift;

  D.layer("Underlay");
  D.rect(
    visible.x,
    visible.y,
    visible.x+visible.width,
    visible.y+visible.height,
    {color:"#05070d"}
  );

  for(let y=startY;y<visible.y+visible.height+tileSize;y+=tileSize){
    for(let x=startX;x<visible.x+visible.width+tileSize;x+=tileSize){
      D.spriteExt(ATLAS,"checker",x,y,{
        originX:0,
        originY:0,
        scale:tileScale,
        alpha:0.92
      });
    }
  }

  D.rect(
    visible.x,
    visible.y,
    visible.x+visible.width,
    visible.y+visible.height,
    {color:COLORS.tint,alpha:0.18}
  );
}

const pointA={x:0,y:0};
const pointB={x:0,y:0};

function drawWorldGrid(camera){
  const D=GM.draw;
  const grid=128;
  const left=Math.ceil(camera.visible.left/grid)*grid;
  const top=Math.ceil(camera.visible.top/grid)*grid;

  for(let x=left;x<=camera.visible.right;x+=grid){
    camera.worldToScene(x,camera.visible.top,pointA);
    camera.worldToScene(x,camera.visible.bottom,pointB);
    D.line(pointA.x,pointA.y,pointB.x,pointB.y,{
      color:COLORS.grid,
      alpha:0.44,
      lineWidth:2
    });
  }

  for(let y=top;y<=camera.visible.bottom;y+=grid){
    camera.worldToScene(camera.visible.left,y,pointA);
    camera.worldToScene(camera.visible.right,y,pointB);
    D.line(pointA.x,pointA.y,pointB.x,pointB.y,{
      color:COLORS.grid,
      alpha:0.44,
      lineWidth:2
    });
  }
}

function drawRoomEdge(camera){
  const D=GM.draw;
  const left=camera.worldToScene(0,0,{});
  const right=camera.worldToScene(ROOM.width,ROOM.height,{});
  const x1=Math.max(camera.display.x,left.x);
  const y1=Math.max(camera.display.y,left.y);
  const x2=Math.min(camera.display.x+camera.display.width,right.x);
  const y2=Math.min(camera.display.y+camera.display.height,right.y);

  if(left.x>=camera.display.x&&left.x<=camera.display.x+camera.display.width){
    D.line(left.x,camera.display.y,left.x,camera.display.y+camera.display.height,{
      color:COLORS.border,lineWidth:4
    });
  }
  if(right.x>=camera.display.x&&right.x<=camera.display.x+camera.display.width){
    D.line(right.x,camera.display.y,right.x,camera.display.y+camera.display.height,{
      color:COLORS.border,lineWidth:4
    });
  }
  if(left.y>=camera.display.y&&left.y<=camera.display.y+camera.display.height){
    D.line(camera.display.x,left.y,camera.display.x+camera.display.width,left.y,{
      color:COLORS.border,lineWidth:4
    });
  }
  if(right.y>=camera.display.y&&right.y<=camera.display.y+camera.display.height){
    D.line(camera.display.x,right.y,camera.display.x+camera.display.width,right.y,{
      color:COLORS.border,lineWidth:4
    });
  }

  return {x1,y1,x2,y2};
}

function displayIntersects(camera,x,y,halfWidth,halfHeight){
  const display=camera.display;
  return x+halfWidth>=display.x&&
    y+halfHeight>=display.y&&
    x-halfWidth<=display.x+display.width&&
    y-halfHeight<=display.y+display.height;
}

function drawMarker(camera,x,y,color){
  if(!camera.containsWorld(x,y,32)) return;
  const p=camera.worldToScene(x,y,{});
  const half=20*camera.zoom;
  if(!displayIntersects(camera,p.x,p.y,half,half)) return;
  GM.draw.spriteExt(ATLAS,"marker",p.x,p.y,{
    originX:0.5,
    originY:0.5,
    scale:camera.zoom,
    color
  });
}

function drawGameWorld(){
  const D=GM.draw;
  const camera=state.camera;

  D.layer("World");
  D.rect(
    camera.display.x,
    camera.display.y,
    camera.display.x+camera.display.width,
    camera.display.y+camera.display.height,
    {color:COLORS.room}
  );

  drawWorldGrid(camera);
  drawRoomEdge(camera);

  drawMarker(camera,48,48,"#ff5454");
  drawMarker(camera,ROOM.width-48,48,"#62ef85");
  drawMarker(camera,48,ROOM.height-48,"#5f8cff");
  drawMarker(camera,ROOM.width-48,ROOM.height-48,"#ff6dff");
  drawMarker(camera,ROOM.width/2,ROOM.height/2,"#5ef0ff");

  if(state.target.active&&camera.containsWorld(state.target.x,state.target.y,48)){
    const target=camera.worldToScene(state.target.x,state.target.y,{});
    D.spriteExt(ATLAS,"target",target.x,target.y,{
      scale:camera.zoom,
      alpha:0.9
    });
  }

  for(const drone of state.drones){
    if(drone.collected||!camera.containsWorld(drone.x,drone.y,32)) continue;
    const point=camera.worldToScene(drone.x,drone.y,{});
    D.spriteExt(ATLAS,"target",point.x,point.y,{scale:camera.zoom,originX:0.5,originY:0.5,color:"#ff8b5e"});
  }

  const alpha=GM.math.clamp(GM.runtime.simulationAlpha,0,1);
  const px=GM.math.lerp(state.player.px,state.player.x,alpha);
  const py=GM.math.lerp(state.player.py,state.player.y,alpha);
  const player=camera.worldToScene(px,py,{});
  D.spriteExt(ATLAS,"player",player.x,player.y,{
    scale:camera.zoom,
    originX:0.5,
    originY:0.5
  });
  if(state.pulseAge>0){
    const pulse=1-state.pulseAge/0.55;
    D.circle(player.x,player.y,64+pulse*160,{color:"#ffe66d",alpha:(1-pulse)*0.44,lineWidth:5});
  }
}

function drawClippedCheckerCell(D,bounds,x,y,width,height,color){
  const left=Math.max(bounds.x,x);
  const top=Math.max(bounds.y,y);
  const right=Math.min(bounds.x+bounds.width,x+width);
  const bottom=Math.min(bounds.y+bounds.height,y+height);
  if(right<=left||bottom<=top) return;
  D.rect(left,top,right,bottom,{color});
}

function drawCheckerRegion(bounds){
  if(!bounds||bounds.width<=0||bounds.height<=0) return;

  const D=GM.draw;
  const tileSize=128;
  const cellSize=64;
  const drift=(GM.runtime.currentTime*0.012)%tileSize;
  const startX=Math.floor((bounds.x-drift)/tileSize)*tileSize+drift;
  const startY=Math.floor((bounds.y-drift)/tileSize)*tileSize+drift;
  const endX=bounds.x+bounds.width;
  const endY=bounds.y+bounds.height;

  D.rect(bounds.x,bounds.y,endX,endY,{color:"#05070d"});

  for(let y=startY;y<endY;y+=tileSize){
    for(let x=startX;x<endX;x+=tileSize){
      drawClippedCheckerCell(D,bounds,x,y,cellSize,cellSize,"#101522");
      drawClippedCheckerCell(D,bounds,x+cellSize,y,cellSize,cellSize,"#182236");
      drawClippedCheckerCell(D,bounds,x,y+cellSize,cellSize,cellSize,"#182236");
      drawClippedCheckerCell(D,bounds,x+cellSize,y+cellSize,cellSize,cellSize,"#101522");
    }
  }

  D.rect(bounds.x,bounds.y,endX,endY,{color:COLORS.tint,alpha:0.18});
}

function drawWorldFrame(){
  if(state.mode!=="game"||!state.camera) return;

  const D=GM.draw;
  const visible=GM.viewport.visibleRoomRect;
  const display=state.camera.display;
  const visibleRight=visible.x+visible.width;
  const visibleBottom=visible.y+visible.height;
  const displayRight=display.x+display.width;
  const displayBottom=display.y+display.height;

  D.layer("Frame");

  drawCheckerRegion({
    x:visible.x,
    y:visible.y,
    width:visible.width,
    height:Math.max(0,display.y-visible.y)
  });

  drawCheckerRegion({
    x:visible.x,
    y:displayBottom,
    width:visible.width,
    height:Math.max(0,visibleBottom-displayBottom)
  });

  drawCheckerRegion({
    x:visible.x,
    y:display.y,
    width:Math.max(0,display.x-visible.x),
    height:display.height
  });

  drawCheckerRegion({
    x:displayRight,
    y:display.y,
    width:Math.max(0,visibleRight-displayRight),
    height:display.height
  });

  D.line(display.x,display.y,displayRight,display.y,{
    color:"#d4e8ff",
    alpha:0.92,
    lineWidth:3
  });
  D.line(display.x,displayBottom,displayRight,displayBottom,{
    color:"#d4e8ff",
    alpha:0.92,
    lineWidth:3
  });
  D.line(display.x,display.y,display.x,displayBottom,{
    color:"#d4e8ff",
    alpha:0.92,
    lineWidth:3
  });
  D.line(displayRight,display.y,displayRight,displayBottom,{
    color:"#d4e8ff",
    alpha:0.92,
    lineWidth:3
  });
}

function drawSplash(){
  const D=GM.draw;
  const screen=GM.viewport.logicalRect;
  const cx=screen.width/2;
  const cy=screen.height/2;

  D.layer("World");
  D.spriteExt(ATLAS,"logo",cx,cy-46,{scale:2});
  D.atlasText(FONT,"CANVAS STACK",cx,cy+52,{
    scale:1.6,
    color:"#ffffff",
    align:"center"
  });
  D.atlasText(FONT,"GENERATED WITH GROUT13",cx,cy+96,{
    scale:0.78,
    color:"#c4dcff",
    align:"center"
  });
}

function drawTitle(){
  const D=GM.draw;
  const screen=GM.viewport.logicalRect;
  const cx=screen.width/2;
  const cy=screen.height/2;

  D.layer("World");
  D.spriteExt(ATLAS,"logo",cx,cy-130,{scale:1.65});
  D.atlasText(FONT,"SINGLE CANVAS",cx,cy-34,{
    scale:1.7,
    color:"#ffffff",
    align:"center"
  });
  D.atlasText(FONT,"UNDERLAY WORLD OVERLAY",cx,cy+18,{
    scale:0.92,
    color:"#87d8ff",
    align:"center"
  });
  D.atlasText(FONT,"TAP TO START",cx,cy+100,{
    scale:1.2,
    color:"#ffe66d",
    align:"center"
  });
}

function drawWorld(){
  if(state.mode==="game") drawGameWorld();
  else if(state.mode==="title") drawTitle();
  else drawSplash();
}

function drawControls(){
  if(!controlsEnabled()) return;
  movementJoystick?.draw();
}

function drawOverlay(){
  const D=GM.draw;
  const visible=GM.viewport.visibleRoomRect;
  const screen=GM.viewport.logicalRect;
  const pad=24;

  D.layer("Overlay");

  if(state.mode==="game"){
    D.rect(pad,pad,pad+282,pad+54,{color:"#05070d",alpha:0.7});
    D.atlasText(FONT,"ROOM 1280 X 1280",pad+14,pad+12,{
      scale:0.9,
      color:"#ffffff"
    });
    D.atlasText(FONT,"ARROWS WASD OR TAP",pad+14,pad+34,{
      scale:0.72,
      color:"#a9bfd9"
    });
    D.atlasText(FONT,`HEALTH ${state.health}/3`,pad+310,pad+18,{
      scale:0.72,
      color:state.health>1?"#ff8b8b":"#ff4f75"
    });
    D.atlasText(FONT,`DRONES ${state.collection}/${state.drones.length}`,pad+310,pad+38,{
      scale:0.72,
      color:"#71f6ff"
    });

    const pauseX=screen.width-pad-118;
    D.rect(pauseX,pad,screen.width-pad,pad+54,{
      color:"#05070d",
      alpha:0.7
    });
    D.atlasText(FONT,"PAUSE",screen.width-pad-59,pad+16,{
      scale:0.9,
      color:"#ffe66d",
      align:"center"
    });

    const pulse=pulseButtonRect();
    D.rect(pulse.x,pulse.y,pulse.x+pulse.width,pulse.y+pulse.height,{
      color:"#05070d",
      alpha:0.78
    });
    D.atlasText(FONT,"PULSE",pulse.x+pulse.width/2,pulse.y+18,{
      scale:1.05,
      color:"#ffe66d",
      align:"center"
    });
    D.atlasText(FONT,"X / SPACE",pulse.x+pulse.width/2,pulse.y+50,{
      scale:0.68,
      color:"#a9bfd9",
      align:"center"
    });
  }

  if(state.mode==="result"){
    D.rect(visible.x,visible.y,visible.x+visible.width,visible.y+visible.height,{color:"#000000",alpha:0.76});
    D.atlasText(FONT,state.outcome==="win"?"VAULT CLEAR":"VAULT LOST",screen.width/2,screen.height/2-46,{scale:2,color:state.outcome==="win"?"#71f6ff":"#ff718e",align:"center"});
    D.atlasText(FONT,`DRONES ${state.collection}/${state.drones.length}`,screen.width/2,screen.height/2+8,{scale:1,color:"#ffffff",align:"center"});
    D.atlasText(FONT,"TAP TO RESTART",screen.width/2,screen.height/2+52,{scale:0.9,color:"#ffe66d",align:"center"});
  }

  if(state.paused){
    D.rect(
      visible.x,
      visible.y,
      visible.x+visible.width,
      visible.y+visible.height,
      {color:"#000000",alpha:0.72}
    );
    D.atlasText(FONT,"PAUSED",screen.width/2,screen.height/2-34,{
      scale:2,
      color:"#ffffff",
      align:"center"
    });
    const resume=continueButtonRect();
    D.rect(resume.x,resume.y,resume.x+resume.width,resume.y+resume.height,{
      color:"#05070d",
      alpha:0.86
    });
    D.atlasText(FONT,"CONTINUE",screen.width/2,screen.height/2+26,{
      scale:1.1,
      color:"#ffe66d",
      align:"center"
    });
  }

  const fade=state.transition.alpha;
  if(fade>0){
    D.layer("Transition");
    D.rect(
      visible.x,
      visible.y,
      visible.x+visible.width,
      visible.y+visible.height,
      {color:"#000000",alpha:fade}
    );
  }
}

function overlayInput(pointer){
  if(!pointer) return false;

  const id=pointerId(pointer);
  if(state.resumePointerId&&id===state.resumePointerId){
    if(pointer.released){
      releaseButton(pointer);
      state.resumePointerId=null;
    }
    return true;
  }

  if(state.paused){
    if(state.pausePointerId&&id===state.pausePointerId){
      if(pointer.pressed&&rectContains(continueButtonRect(),pointer.roomX,pointer.roomY)){
        resumeFromPause(pointer);
      }else if(pointer.released){
        releaseButton(pointer);
        state.pausePointerId=null;
      }
      return true;
    }
    if(pointer.pressed&&rectContains(continueButtonRect(),pointer.roomX,pointer.roomY)){
      resumeFromPause(pointer);
    }
    return true;
  }

  if(state.transition.next||state.transition.alpha>0.08) return true;

  if(state.mode==="splash") return true;

  if(state.mode==="title"){
    if(pointer.released) beginTransition("game");
    return true;
  }

  if(state.mode==="result"){
    if(pointer.released) restart();
    return true;
  }

  if(state.mode==="game"&&pointer.pressed){
    if(rectContains(pauseButtonRect(),pointer.roomX,pointer.roomY)){
      state.pausePointerId=captureButton(pointer);
      state.paused=true;
      markTouch(pointer);
      syncMovementControl();
      updateProof();
      return true;
    }
  }

  return false;
}

function controlInput(pointer){
  if(!pointer) return false;
  const id=pointerId(pointer);
  if(!id) return false;

  if(state.pulsePointerId===id){
    if(pointer.released){
      releaseButton(pointer);
      state.pulsePointerId=null;
    }
    return true;
  }
  if(!controlsEnabled()||pointer.owner) return false;
  if(pointer.pressed&&rectContains(pulseButtonRect(),pointer.roomX,pointer.roomY)){
    state.pulsePointerId=captureButton(pointer);
    markTouch(pointer);
    proof.touchPulse=proof.touchPulse||pointer.kind==="touch";
    triggerPulse();
    return true;
  }
  return false;
}

function worldInput(pointer){
  if(state.mode!=="game"||state.paused||!pointer||!pointer.pressed||pointer.owner) return false;
  const camera=state.camera;
  if(!camera.containsScene(pointer.roomX,pointer.roomY)) return false;
  camera.sceneToWorld(pointer.roomX,pointer.roomY,state.target);
  state.target.x=GM.math.clamp(state.target.x,0,ROOM.width);
  state.target.y=GM.math.clamp(state.target.y,0,ROOM.height);
  state.target.active=true;
  return true;
}

function inputPointer(pointer){
  if(!pointer) return null;
  return {
    ...pointer,
    roomX:pointer.x,
    roomY:pointer.y
  };
}

function processAdditionalPointers(primary){
  if(typeof GM.input.activePointers!=="function") return;
  const primaryId=primary?.id||null;
  for(const rawPointer of GM.input.activePointers()){
    if(!rawPointer||String(rawPointer.id)===String(primaryId)) continue;
    const pointer=inputPointer(rawPointer);
    markTouch(pointer);
    if(overlayInput(pointer)) continue;
    controlInput(pointer);
  }
}

const stack=GM.layer.compose([
  {
    name:"underlay",
    order:0,
    draw:drawUnderlay
  },
  {
    name:"world",
    order:10,
    input:worldInput,
    step(dt){
      if(state.mode==="game"&&!state.paused) updatePlayer(dt);
    },
    draw:drawWorld
  },
  {
    name:"frame",
    order:15,
    enabled(){
      return state.mode==="game";
    },
    draw:drawWorldFrame
  },
  {
    name:"controls",
    order:18,
    input:controlInput,
    draw:drawControls
  },
  {
    name:"overlay",
    order:20,
    input:overlayInput,
    step(dt){
      state.modeAge+=dt;
      state.messageAge+=dt;

      if(state.mode==="splash"&&state.modeAge>1.55&&!state.transition.next){
        beginTransition("title");
      }

      stepTransition(dt);
    },
    draw:drawOverlay
  }
]);

function create(){
  GM.layer.stack(
    ["Underlay","World","Frame","Overlay","Transition"],
    {start:-100,step:100}
  );
  GM.layer.assertAbove("Frame","World");
  GM.layer.assertAbove("Overlay","Frame");
  GM.layer.assertAbove("Transition","Overlay");

  installGeneratedAssets();

  state.camera=GM.camera.createRoomView({
    roomWidth:ROOM.width,
    roomHeight:ROOM.height,
    viewHeight:ROOM.viewHeight,
    minAspect:ROOM.minAspect,
    maxAspect:ROOM.maxAspect
  });
  state.camera.layout(GM.viewport.logicalRect);
  movementJoystick=GM.input.createVirtualJoystick({
    id:"grout-vault-movement",
    mode:"fixed",
    layer:"controls",
    radius:76,
    deadzone:0.14,
    pointerKinds:["touch","pen","mouse"],
    enabled:false,
    layout(viewport){
      const safe=viewport.safeScreenRect||viewport.screenRect;
      return {
        origin:{x:safe.x+104,y:safe.y+safe.height-112},
        zone:{x:safe.x,y:safe.y+safe.height*0.32,width:safe.width*0.58,height:safe.height*0.68}
      };
    },
    style:{
      baseFill:"#07101c",
      baseStroke:"#d4e8ff",
      knobFill:"#71f6ff",
      knobStroke:"#ffffff"
    }
  });
  proof.startGame=()=>beginTransition("game");
  proof.triggerPulse=triggerPulse;
  proof.triggerWin=()=>finish("win");
  proof.triggerLoss=()=>finish("loss");
  proof.restart=restart;
  proof.rendererType=GM.phaser.game?.renderer?.type??null;
  syncMovementControl();
  updateProof();
  proof.complete=true;
}

GM.app.start({
  parent:"game",
  host:"fullscreen",
  viewport:{
    mode:"adaptive",
    width:720,
    height:1280,
    fit:"contain",
    scaleStep:false,
    fitArea:"safe",
    safeArea:"frame",
    align:{
      portrait:{x:"center",y:"center"},
      landscape:{x:"center",y:"center"}
    },
    minHeight:960,
    targetHeight:1280,
    maxHeight:1800,
    desktopBreakpoint:1000,
    desktopMinWidth:1280,
    desktopHeight:720,
    desktopMaxWidth:1920
  },
  simulationHz:60,
  maxFrameDeltaMs:100,
  maxCatchUpSteps:5,
  randomSeed:1337,
  renderQuality:"pixel-art",
  type:renderType,
  pixelArt:true,
  antialias:false,
  roundPixels:true,
  renderResolution:"auto",
  maxRenderResolution:3,
  stage:false,
  curtain:false,
  globals:false,
  background:"#05070d",
  drawValidation:"report",
  layerAssertions:true,
  create,
  input(){
    const primary=GM.input.primaryPointer();
    processAdditionalPointers(primary);
    if(movementJoystick?.pressed){
      proof.joystickPresses+=1;
      markTouch(GM.input.getPointer?.(movementJoystick.pointerId));
    }
    if(movementJoystick?.active&&movementJoystick.magnitude>0) proof.joystickMoved=true;
    stack.input(primary,GM.runtime.deltaSec);
    if(
      state.mode==="game"&&
      (GM.input.keyPressed("P")||GM.input.keyPressed(GM.key.ESCAPE))
    ){
      state.paused=!state.paused;
      clearControlGestures();
      syncMovementControl();
      updateProof();
    }
    if(GM.input.keyPressed("X")||GM.input.keyPressed(GM.key.SPACE)) triggerPulse();
  },
  step(_gm,dt){stack.step(dt);},
  draw(){stack.draw();},
  layout(_gm,viewport){if(state.camera) state.camera.layout(viewport.logicalRect);},
  onError(error){
    const text=error instanceof Error?(error.stack||error.message):String(error);
    proof.failed=true;
    proof.complete=false;
    proof.errors.push(text);
  }
});
</script>
</body>
