<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05050c">
    <title>Fruit Shot Merge - Modular Grout13 + Phaser 4 Facade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/examples/native-app-shell.css">
    <style>
        #status,
        #proof-error {
            position: fixed;
            z-index: 10;
            margin: 0;
            font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
            pointer-events: none;
        }

        #status {
            top: max(8px, env(safe-area-inset-top, 0px));
            right: max(8px, env(safe-area-inset-right, 0px));
            max-width: min(72vw, 360px);
            padding: 6px 8px;
            border: 1px solid #31314d;
            border-radius: 6px;
            background: rgba(8, 8, 20, 0.84);
            color: #c9c9df;
        }

        #proof-error {
            inset: 0 0 auto;
            max-height: 42vh;
            overflow: auto;
            padding: 10px;
            background: #300;
            color: #ff9c9c;
        }
    </style>
</head>
<body data-gm-app-shell="locked">
    <div id="status" class="gm-app-status" role="status">Fruit Shot modular CDN booting...</div>
    <pre id="proof-error" class="gm-app-error" role="alert" hidden></pre>
    <div class="gm-app-shell">
        <div id="game" class="gm-app-surface gm-app-safe-area gm-app-surface--pixel-art gm-app-surface--integer-pixel-art"></div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "phaser": "https://cdn.jsdelivr.net/gh/phaserjs/phaser@v4.2.1/dist/phaser.esm.js",
                "phaser4-facade": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/dist/gm-phaser4.module.js",
                "phaser4-facade/grout13": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/dist/gm-phaser4-grout13.module.js",
                "grout13": "https://cdn.jsdelivr.net/gh/Shoozes/grout13@main/dist/grout13.mjs"
            }
        }
    </script>
    <script>
        (function () {
            "use strict";
            const status = document.getElementById("status");
            const errorBox = document.getElementById("proof-error");
            const proof = window.__fruitShotModularProof = {
                architecture: "module-grout13",
                phase: "loading",
                complete: false,
                failed: false,
                errors: [],
                fileMode: window.location.protocol === "file:",
                fileSafe: true,
                serverRequired: false,
                pixelSourceScale: 4,
                nativeSpriteFrames: true,
                bitmapTextAvoided: true
            };
            if (proof.fileMode) {
                proof.phase = "server-required";
                proof.serverRequired = true;
                status.textContent = "This modular example needs a local HTTP server.\nRun .\\run.ps1 -Task dev, then open this page from localhost.";
                errorBox.hidden = false;
                errorBox.textContent = "ES modules deliberately do not load from file: URLs. Use fruit-shot.html or fruit-shot-grout13.html for a directly opened all-in-one demo.";
                return;
            }
            const module = document.createElement("script");
            module.type = "module";
            module.src = "./fruit-shot-modular.js";
            module.onerror = function () {
                proof.failed = true;
                proof.phase = "failed";
                proof.errors.push("The modular Fruit Shot entry could not load.");
                status.textContent = "Fruit Shot modular CDN failed";
                errorBox.hidden = false;
                errorBox.textContent = proof.errors[0];
            };
            document.body.appendChild(module);
        }());
    </script>
</body>
</html>
