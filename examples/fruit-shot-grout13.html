<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#073b4c">
    <title>Phaser 4 Facade Fruit Shot Grout13 CDN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/examples/native-app-shell.css">
</head>
<body data-gm-app-shell="locked">
    <div id="status" class="gm-app-status" role="status">Fruit Shot Grout13 CDN booting...</div>
    <div id="proof-error" class="gm-app-error" role="alert" hidden></div>
    <div class="gm-app-shell">
        <div id="game" class="gm-app-surface gm-app-safe-area gm-app-surface--pixel-art"></div>
    </div>
    <script>
        (function () {
            "use strict";

            const RUNTIME_VERSION = "0.1.0";
            const renderType = new URLSearchParams(window.location.search).get("render") === "canvas"
                ? "CANVAS"
                : "WEBGL";
            const proof = window.__fruitShotGrout13Proof = {
                architecture: "all-in-one-grout13",
                phase: "booting",
                complete: false,
                failed: false,
                errors: [],
                frames: 0,
                atlasFrames: [],
                render: renderType,
                phaserSource: "",
                runtimeSource: "",
                groutSource: "",
                bridgeSource: "",
                grout13: false,
                grout13PayloadBytes: 0,
                pixelTextSeen: false,
                pixelTextFlipY: false,
                pixelTextDraws: 0,
                spriteOptionsSeen: false,
                fixedStepsSeen: false,
                headingDraws: 0,
                summaryDraws: 0,
                sprite: null
            };
            const SCRIPT_TIMEOUT_MS = 8000;
            const phaserCandidates = [
                "https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"
            ];
            const runtimeCandidates = [
                "https://cdn.jsdelivr.net/npm/phaser4-facade@0.1.0/dist/gm-phaser4.global.min.js",
                "../dist/gm-phaser4.global.min.js",
                "../main-files/runtime/gm-phaser4/gm-phaser4.global.min.js",
                "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/dist/gm-phaser4.global.min.js"
            ];
            const groutCandidates = [
                "https://cdn.jsdelivr.net/gh/Shoozes/grout13@main/dist/grout13.global.min.js"
            ];
            const bridgeCandidates = [
                "https://cdn.jsdelivr.net/npm/phaser4-facade@0.1.0/dist/gm-phaser4-grout13.global.min.js",
                "../dist/gm-phaser4-grout13.global.min.js",
                "../main-files/runtime/gm-phaser4/gm-phaser4-grout13.global.min.js",
                "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@main/dist/gm-phaser4-grout13.global.min.js"
            ];
            let launched = false;
            let errorHandlersInstalled = false;

            function setStatus(text) {
                const status = document.getElementById("status");
                if (!status) return;
                status.hidden = false;
                status.textContent = text;
            }

            function hideStatus() {
                const status = document.getElementById("status");
                if (status) status.hidden = true;
            }

            function failProof(error) {
                const message = error instanceof Error ? error.message : String(error);
                proof.failed = true;
                proof.complete = false;
                proof.phase = "failed";
                proof.errors.push(message);
                setStatus("Fruit Shot Grout13 CDN failed: " + message);
                const errorNode = document.getElementById("proof-error");
                if (errorNode) {
                    errorNode.hidden = false;
                    errorNode.textContent = message;
                }
            }

            function installErrorHandlers() {
                if (errorHandlersInstalled) return;
                errorHandlersInstalled = true;
                window.addEventListener("error", (event) => failProof(event.error || event.message || "window error"));
                window.addEventListener("unhandledrejection", (event) => failProof(event.reason || "unhandled rejection"));
            }

            function validatePhaser() {
                return Boolean(window.Phaser && window.Phaser.Game && window.Phaser.Scene);
            }

            function validateRuntime() {
                return Boolean(
                    validatePhaser() &&
                    window.GM &&
                    window.GM.version === RUNTIME_VERSION &&
                    window.GM.app &&
                    typeof window.GM.app.start === "function"
                );
            }

            function validateGrout13() {
                return Boolean(
                    window.GROUT13 &&
                    typeof window.GROUT13.compileGrout13Atlas === "function" &&
                    typeof window.GROUT13.decodeGrout13Atlas === "function"
                );
            }

            function validateBridge() {
                return Boolean(
                    validateRuntime() &&
                    validateGrout13() &&
                    window.GM.grout13 &&
                    typeof window.GM.grout13.addAtlas === "function"
                );
            }

            function loadScriptCandidates(candidates, validate, onReady, onFail) {
                let index = 0;

                function tryNext() {
                    if (index >= candidates.length) {
                        onFail();
                        return;
                    }

                    const candidate = candidates[index];
                    index += 1;
                    const script = document.createElement("script");
                    let settled = false;
                    const timeout = window.setTimeout(() => finish(false), SCRIPT_TIMEOUT_MS);

                    function finish(loaded) {
                        if (settled) return;
                        settled = true;
                        window.clearTimeout(timeout);
                        if (loaded && validate()) {
                            onReady(candidate);
                            return;
                        }
                        if (script.parentNode) script.parentNode.removeChild(script);
                        tryNext();
                    }

                    script.src = candidate;
                    script.onload = () => finish(true);
                    script.onerror = () => finish(false);
                    document.head.appendChild(script);
                }

                tryNext();
            }

            function createFruitSpecs() {
                return [
                    {
                        name: "strawberry",
                        spec: {
                            w: 16,
                            h: 16,
                            steps: [
                                { type: "heart_filled", x: 2, y: 2, w: 12, h: 12, col: 0xef476f },
                                { type: "rect_filled", x: 6, y: 0, w: 4, h: 4, col: 0x06d6a0 },
                                { type: "plot", x: 6, y: 7, col: 0xffd166 },
                                { type: "plot", x: 10, y: 9, col: 0xffd166 }
                            ]
                        }
                    },
                    {
                        name: "lemon",
                        spec: {
                            w: 16,
                            h: 16,
                            steps: [
                                { type: "circle_filled", x: 1, y: 3, w: 14, h: 10, col: 0xffd166 },
                                { type: "rect_filled", x: 6, y: 1, w: 4, h: 3, col: 0x06d6a0 }
                            ]
                        }
                    },
                    {
                        name: "lime",
                        spec: {
                            w: 16,
                            h: 16,
                            steps: [
                                { type: "circle_filled", x: 1, y: 2, w: 14, h: 14, col: 0x06d6a0 },
                                { type: "circle", x: 3, y: 4, w: 10, h: 10, col: 0xffffff },
                                { type: "rect_filled", x: 7, y: 0, w: 2, h: 3, col: 0x118ab2 }
                            ]
                        }
                    },
                    {
                        name: "fruit-shot-title",
                        spec: {
                            w: 180,
                            h: 21,
                            steps: [
                                { type: "bitmap_text", x: 0, y: 0, w: 180, align: "center", text: "FRUIT SHOT", col: 0xffffff, scale: 3 }
                            ]
                        }
                    },
                    {
                        name: "fruit-shot-subtitle",
                        spec: {
                            w: 180,
                            h: 14,
                            steps: [
                                { type: "bitmap_text", x: 0, y: 0, w: 180, align: "center", text: "GROUT13 CDN", col: 0xffd166, scale: 2 }
                            ]
                        }
                    },
                    {
                        name: "fruit-shot-caption",
                        spec: {
                            w: 84,
                            h: 7,
                            steps: [
                                { type: "bitmap_text", x: 0, y: 0, text: "GROUT13 ATLAS", col: 0xffffff }
                            ]
                        }
                    },
                    {
                        name: "fruit-shot-proof",
                        spec: {
                            w: 72,
                            h: 7,
                            steps: [
                                { type: "bitmap_text", x: 0, y: 0, text: "CANVAS WEBGL", col: 0xffd166 }
                            ]
                        }
                    }
                ];
            }

            function observeSprite(sprite) {
                proof.sprite = sprite ? {
                    x: Number(sprite.x),
                    y: Number(sprite.y),
                    angle: Number(sprite.angle),
                    scaleX: Number(sprite.scaleX),
                    scaleY: Number(sprite.scaleY)
                } : null;
            }

            function drawPixelLabel(GM, frame, x, y, options) {
                const sprite = GM.draw.spriteExt("fruit-atlas", frame, x, y, { ...options, flipY: true });
                proof.pixelTextSeen = proof.pixelTextSeen || Boolean(sprite);
                proof.pixelTextFlipY = proof.pixelTextFlipY || sprite?.flipY === true;
                proof.pixelTextDraws += 1;
                return sprite;
            }

            function startFruitShot() {
                if (launched) return;
                launched = true;
                const GM = window.GM;

                try {
                    GM.app.start({
                        parent: "game",
                        width: 720,
                        height: 1280,
                        simulationHz: 60,
                        maxFrameDeltaMs: 100,
                        maxCatchUpSteps: 5,
                        randomSeed: 1337,
                        responsive: true,
                        renderQuality: "pixel-art",
                        pixelArt: true,
                        antialias: false,
                        roundPixels: true,
                        type: renderType,
                        create() {
                            const atlas = GM.grout13.addAtlas("fruit-atlas", createFruitSpecs(), {
                                preset: "pixel"
                            });
                            proof.atlasFrames = [...atlas.frameNames];
                            proof.grout13 = atlas.frameCount === proof.atlasFrames.length;
                            proof.grout13PayloadBytes = Number(atlas.payloadBytes || 0);
                            GM.layer.define("fruit", 100);
                            GM.entity.spawn({
                                create() {
                                    this.fruit = GM.math.choose("strawberry", "lemon", "lime") || "strawberry";
                                    this.spin = GM.math.random_range(-18, 18);
                                    this.x = GM.runtime.centerX;
                                    this.y = GM.runtime.centerY + 80;
                                },
                                step() {
                                    this.x += this.spin * GM.runtime.deltaSec;
                                    if (this.x < 80 || this.x > GM.runtime.roomWidth - 80) this.spin *= -1;
                                },
                                draw() {
                                    const rotation = Math.round((this.spin * GM.runtime.currentTime / 1000) / 15) * 15;
                                    const sprite = GM.draw.spriteExt("fruit-atlas", this.fruit, this.x, this.y, {
                                        width: 96,
                                        rotation,
                                        originX: 0.5,
                                        originY: 0.5
                                    });
                                    proof.spriteOptionsSeen = proof.spriteOptionsSeen || Boolean(sprite);
                                    observeSprite(sprite);
                                }
                            }, { layer: "fruit", name: "fruit" });
                        },
                        step(_api, deltaSec) {
                            proof.frames += 1;
                            proof.fixedStepsSeen = proof.fixedStepsSeen || Number.isFinite(deltaSec) && deltaSec > 0;
                            proof.phase = "running";
                        },
                        draw() {
                            GM.draw.rect(0, 0, GM.runtime.roomWidth, GM.runtime.roomHeight, { color: "#073b4c" });
                            GM.draw.polyline([
                                { x: 48, y: 220 },
                                { x: GM.runtime.centerX, y: 190 },
                                { x: GM.runtime.roomWidth - 48, y: 220 }
                            ], { color: "#ffd166", lineWidth: 2 });
                            const heading = drawPixelLabel(GM, "fruit-shot-title", GM.runtime.centerX, 82, {
                                scale: 1,
                                originX: 0.5,
                                originY: 0.5
                            });
                            proof.headingDraws += 1;
                            const summary = drawPixelLabel(GM, "fruit-shot-subtitle", GM.runtime.centerX, 152, {
                                scale: 1,
                                originX: 0.5,
                                originY: 0.5
                            });
                            proof.summaryDraws += 1;
                            drawPixelLabel(GM, "fruit-shot-caption", 28, GM.runtime.roomHeight - 76, {
                                scale: 2,
                                originX: 0,
                                originY: 0
                            });
                            drawPixelLabel(GM, "fruit-shot-proof", GM.runtime.roomWidth - 28, GM.runtime.roomHeight - 76, {
                                scale: 2,
                                originX: 1,
                                originY: 0
                            });
                            if (proof.frames >= 8 && !proof.failed) {
                                proof.phase = "complete";
                                proof.complete = true;
                                hideStatus();
                            }
                        },
                        onError(error) {
                            failProof(error);
                        }
                    });
                } catch (error) {
                    failProof(error);
                }
            }

            installErrorHandlers();
            setStatus("Fruit Shot Grout13 CDN loading Phaser...");
            loadScriptCandidates(
                phaserCandidates,
                validatePhaser,
                (phaserSource) => {
                    proof.phaserSource = phaserSource;
                    setStatus("Fruit Shot Grout13 CDN loading facade...");
                    loadScriptCandidates(
                        runtimeCandidates,
                        validateRuntime,
                        (runtimeSource) => {
                            proof.runtimeSource = runtimeSource;
                            setStatus("Fruit Shot Grout13 CDN loading Grout13...");
                            loadScriptCandidates(
                                groutCandidates,
                                validateGrout13,
                                (groutSource) => {
                                    proof.groutSource = groutSource;
                                    setStatus("Fruit Shot Grout13 CDN loading bridge...");
                                    loadScriptCandidates(
                                        bridgeCandidates,
                                        validateBridge,
                                        (bridgeSource) => {
                                            proof.bridgeSource = bridgeSource;
                                            startFruitShot();
                                        },
                                        () => failProof("Unable to load the gm-phaser4 Grout13 bridge.")
                                    );
                                },
                                () => failProof("Unable to load the Grout13 CDN runtime.")
                            );
                        },
                        () => failProof("Unable to load the gm-phaser4 CDN runtime.")
                    );
                },
                () => failProof("Unable to load Phaser from the CDN.")
            );
        }());
    </script>
</body>
</html>
