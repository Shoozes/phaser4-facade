<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>Fruit Shot Merge - Compact Grout13 + Phaser4 Facade</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@06aba3eeadd027cb4854b6a34fde6ce454aa06a1/examples/native-app-shell.css">
<style>
:root{
  --gm-app-safe-area-top:env(safe-area-inset-top,0px);
  --gm-app-safe-area-right:env(safe-area-inset-right,0px);
  --gm-app-safe-area-bottom:env(safe-area-inset-bottom,0px);
  --gm-app-safe-area-left:env(safe-area-inset-left,0px)
}
*{box-sizing:border-box}
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#11131f}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#game,canvas{display:block;width:100%;height:100%}
canvas{image-rendering:pixelated;touch-action:none}
#status,#error{
  position:fixed;z-index:10;right:max(12px,var(--gm-app-safe-area-right));
  font:12px/1.4 ui-monospace,monospace;pointer-events:none
}
#status{top:max(12px,var(--gm-app-safe-area-top));color:#fff}
#error{left:12px;bottom:max(12px,var(--gm-app-safe-area-bottom));padding:8px;background:#8e1830;color:#fff;white-space:pre-wrap}
</style>
</head>
<body data-gm-app-shell="locked">
<div id="game"></div>
<div id="status">Loading...</div>
<pre id="error" hidden></pre>

<script type="importmap">
{
  "imports": {
    "phaser": "https://cdn.jsdelivr.net/gh/phaserjs/phaser@v4.2.1/dist/phaser.esm.js",
    "phaser4-facade": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@2726c3aac753e8060eabbaf71e54420a7624a867/dist/gm-phaser4.module.js",
    "phaser4-facade/grout13": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@2726c3aac753e8060eabbaf71e54420a7624a867/dist/gm-phaser4-grout13.module.js",
    "grout13": "https://cdn.jsdelivr.net/gh/Shoozes/grout13@dd41ded3a8bc1b11b3b733535688b03ef4984bce/dist/grout13.mjs",
    "grout13/font": "https://cdn.jsdelivr.net/gh/Shoozes/grout13@dd41ded3a8bc1b11b3b733535688b03ef4984bce/dist/grout13-font.mjs",
    "fruit-shot/config": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@2726c3aac753e8060eabbaf71e54420a7624a867/examples/fruit-shot/config.js",
    "fruit-shot/art": "https://cdn.jsdelivr.net/gh/Shoozes/phaser4-facade@2726c3aac753e8060eabbaf71e54420a7624a867/examples/fruit-shot/art.js"
  }
}
</script>

<script type="module">
import { GM } from "phaser4-facade";
import { installGrout13Bridge } from "phaser4-facade/grout13";
import * as GROUT13 from "grout13";
import { compileFontAtlas } from "grout13/font";
import { DEFAULT_FRUIT_SHOT as GAME } from "fruit-shot/config";
import { compileFruitShotFont, fruitRadiusFromFrame } from "fruit-shot/art";

installGrout13Bridge(GM, GROUT13);

const status = document.querySelector("#status");
const errorBox = document.querySelector("#error");
const proof = globalThis.__fruitMergeProof = {
  complete:false, failed:false, fileMode:location.protocol === "file:", errors:[], viewport:"720x720", mouse:true, touch:true,
  atlasText:true, grout13:true, fixedSimulation:true
};

const ATLAS = "fruit-merge";
const FONT = "pixel-3x5";
const WALL = 18;
const CEILING = GAME.hudHeight + 10;
const TIERS = [
  ["BERRY",58,0xff4f75,0x9d2449,0xffc2d0],
  ["PEACH",68,0xff9a62,0xb94d38,0xffd7b5],
  ["PLUM",78,0xb86bff,0x6530a4,0xe8c9ff],
  ["LEMON",88,0xffdc58,0xb48516,0xfff4b8],
  ["LIME",98,0x61e985,0x198b4f,0xc9ffda],
  ["MELON",108,0x47d7ff,0x176b9d,0xc1f4ff]
];
const P = {
  gravity:112, damping:.994, bounce:.88, floorBounce:.70,
  shot:1000, shotBonus:520, cueLife:1.75, mergeLock:.34, mergeKick:148
};
const R = { maxFruit:24, spawnEvery:4.4, dangerCount:4, dangerHold:2.2 };

const state = {
  balls:[], particles:[], score:0, combo:1, comboAge:0,
  cue:null, cueAge:0, spawnAge:0, dangerAge:0,
  canShoot:true, gameOver:false, id:0,
  aim:{active:false,id:null,x:GAME.viewport.width/2,y:GAME.cueY}
};

const clamp = (v,a,b) => GM.math.clamp(v,a,b);
const rand = (a,b) => GM.math.random_range(a,b);
const irand = (a,b) => GM.math.irandom_range(a,b);
const radius = type => fruitRadiusFromFrame(GM.asset, ATLAS, GAME.tiers[type].frame);
const fruitCount = () => {
  let n=0;
  for(const b of state.balls) if(b.alive && b.type>=0) n++;
  return n;
};

const PIXEL = 4;
function rect(steps,x,y,w,h,col){ steps.push({type:"rect_filled",x,y,w,h,col}); }
function disc(steps,cx,cy,r,col){
  const x0=Math.floor(cx-r),x1=Math.ceil(cx+r),y0=Math.floor(cy-r),y1=Math.ceil(cy+r),rr=r*r;
  for(let y=y0;y<=y1;y+=PIXEL){
    let start=-1;
    for(let x=x0;x<=x1+PIXEL;x+=PIXEL){
      const inside=x<=x1&&((x-cx)**2+(y-cy)**2<=rr);
      if(inside&&start<0) start=x;
      if(!inside&&start>=0){rect(steps,start,y,x-start,PIXEL,col);start=-1;}
    }
  }
}
function fruitAsset([,size,body,shade,light], type){
  const c=size/2,r=size*.42,s=[];
  disc(s,c,c+3,r+4,0x251b38);
  disc(s,c+3,c+6,r,shade);
  disc(s,c-2,c,r-3,body);
  disc(s,c-r*.28,c-r*.30,Math.max(6,r*.21),light);
  rect(s,Math.floor(c-2),0,5,Math.max(8,size*.18|0),0x69432e);
  rect(s,Math.floor(c+2),5,Math.max(8,size*.18|0),5,0x67dc75);
  rect(s,Math.floor(c+5),9,Math.max(6,size*.13|0),4,0x2f9d55);
  return {name:`fruit-${type}`,spec:{w:size,h:size,steps:s}};
}
function circleAsset(name,size,rings){
  const s=[],c=size/2;
  for(const [r,col,dx=0,dy=0] of rings) disc(s,c+dx,c+dy,r,col);
  return {name,spec:{w:size,h:size,steps:s}};
}
function installAssets(){
  const art = TIERS.map(fruitAsset);
  const cue=circleAsset("cue",64,[[30,0x26243b],[27,0xf4fbff], [8,0xbfeeff,-9,-10]]);
  rect(cue.spec.steps,15,42,34,4,0xc9d4e3);
  art.push(
    cue,
    circleAsset("disc",32,[[15,0xffffff]]),
    {name:"spark",spec:{w:24,h:24,steps:[
      {type:"rect_filled",x:10,y:0,w:4,h:24,col:0xffffff},
      {type:"rect_filled",x:0,y:10,w:24,h:4,col:0xffffff},
      {type:"rect_filled",x:6,y:6,w:12,h:12,col:0xffffff}
    ]}},
    circleAsset("aim-dot",16,[[7,0x4b4d68],[4,0xffffff]])
  );
  GM.grout13.addAtlas(ATLAS, art, {
    replace:true, preset:"pixel",
    compileOptions:{atlasOptions:{maxWidth:512,maxHeight:512}}
  });
  const font = compileFruitShotFont({compileFontAtlas});
  GM.grout13.addFont(FONT,font,{replace:true});
}

function spawn(x,y,type=irand(0,2),r=null){
  const rr = r ?? radius(type);
  const b = {
    id:++state.id,type,x,y,px:x,py:y,r:rr,
    vx:rand(-18,18),vy:rand(-12,12),lock:0,alive:true,age:0
  };
  GM.debug.assertFinite("fruit spawn",{x,y,radius:rr});
  state.balls.push(b);
  return b;
}
function seed(){
  const rows = [[.18,.48,0],[.34,.63,1],[.50,.43,0],[.66,.59,2],[.82,.48,1]];
  for(const [nx,ny,t] of rows){
    const r=radius(t);
    spawn(WALL+r+(GAME.viewport.width-WALL*2-r*2)*nx,
      CEILING+(GAME.floorY-CEILING)*ny,t,r);
  }
  const r=radius(0);
  spawn(360-r*.55,GAME.floorY-r-8,0,r);
  spawn(360+r*.55,GAME.floorY-r-8,0,r);
}
function reset(){
  state.balls.length=state.particles.length=0;
  Object.assign(state,{
    score:0,combo:1,comboAge:0,cue:null,cueAge:0,spawnAge:0,dangerAge:0,
    canShoot:true,gameOver:false
  });
  state.aim.active=false;
  seed();
}

function move(b,dt){
  b.px=b.x; b.py=b.y; b.age+=dt; b.lock=Math.max(0,b.lock-dt);
  const d=Math.pow(P.damping,dt*60);
  b.vy+=P.gravity*dt; b.vx*=d; b.vy*=d;
  b.x+=b.vx*dt; b.y+=b.vy*dt;

  if(b.x-b.r<WALL){ b.x=WALL+b.r; b.vx=Math.abs(b.vx)*P.bounce; }
  if(b.x+b.r>GAME.viewport.width-WALL){
    b.x=GAME.viewport.width-WALL-b.r; b.vx=-Math.abs(b.vx)*P.bounce;
  }
  if(b.y-b.r<CEILING){ b.y=CEILING+b.r; b.vy=Math.abs(b.vy)*P.bounce; }
  if(b.type<0 && b.y+b.r>GAME.viewport.height){
    b.y=GAME.viewport.height-b.r;
    b.vy=-Math.abs(b.vy)*P.bounce;
  }
  if(b.type>=0 && b.y+b.r>GAME.floorY){
    b.y=GAME.floorY-b.r;
    b.vy=-Math.abs(b.vy)*P.floorBounce;
    b.vx*=.94;
  }
}
function burst(x,y,color,count=7){
  while(count-- && state.particles.length<80){
    const a=rand(0,Math.PI*2), s=rand(70,190);
    state.particles.push({x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:rand(.3,.65),color});
  }
}
function merge(a,b){
  const next=a.type+1;
  a.alive=b.alive=false;
  if(next>=TIERS.length){
    state.score+=GAME.tiers[a.type].score*4*state.combo;
    burst((a.x+b.x)/2,(a.y+b.y)/2,"#ffd166",14);
    return;
  }
  const m=spawn((a.x+b.x)/2,(a.y+b.y)/2,next,radius(next));
  m.vx=(a.vx+b.vx)*.35;
  m.vy=(a.vy+b.vy)*.35-P.mergeKick;
  m.lock=P.mergeLock;
  state.score+=Math.round(GAME.tiers[next].score*state.combo);
  state.combo=Math.min(9.9,state.combo+.25);
  state.comboAge=0;
  burst(m.x,m.y,"#ffd166");
}
function collide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r,d2=dx*dx+dy*dy;
  if(d2>=min*min) return;
  const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,push=(min-d)/2;
  a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
  const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(rv>0){
    const k=rv*.9;
    a.vx-=k*nx;a.vy-=k*ny;b.vx+=k*nx;b.vy+=k*ny;
  }
  if(a.type>=0 && a.type===b.type && !a.lock && !b.lock) merge(a,b);
}

function resolveShotTarget(x,y){
  const dx=x-360, dy=y-GAME.cueY;
  return {x:360+dx,y:GAME.cueY-Math.max(72,Math.abs(dy))};
}
function shoot(x,y){
  if(!state.canShoot||state.gameOver) return;
  const t=resolveShotTarget(x,y);
  const n=GM.math.normalize2(t.x-360,t.y-GAME.cueY);
  const power=P.shot+Math.min(P.shotBonus,n.length*1.35);
  const cue=spawn(360,GAME.cueY,-1,GAME.launcher.cueRadius);
  cue.vx=n.x*power; cue.vy=n.y*power; cue.age=0;
  state.cue=cue; state.cueAge=0; state.canShoot=false;
}
function input(){
  const p=GM.input.primaryPointer();
  if(state.gameOver){
    if(p?.released||GM.input.keyPressed(GM.key.SPACE)) reset();
    return;
  }
  if(state.canShoot && p?.pressed && !state.aim.active){
    state.aim={active:true,id:p.id,x:p.roomX,y:p.roomY};
    GM.input.capturePrimary("aim");
  }
  if(state.aim.active && p && p.id===state.aim.id){
    state.aim.x=p.roomX; state.aim.y=p.roomY;
    if(p.released){
      shoot(p.roomX,p.roomY);
      GM.input.releasePrimary("aim");
      state.aim.active=false;
    }
  }
  if(state.canShoot && GM.input.keyPressed(GM.key.SPACE)) shoot(360,GAME.dangerY+80);
}

function step(dt){
  input();
  for(const b of state.balls) if(b.alive) move(b,dt);

  for(let i=0;i<state.balls.length;i++){
    const a=state.balls[i]; if(!a.alive) continue;
    for(let j=i+1;j<state.balls.length;j++){
      const b=state.balls[j]; if(b.alive) collide(a,b);
      if(!a.alive) break;
    }
  }
  state.balls=state.balls.filter(b=>b.alive);

  for(const p of state.particles){
    p.px=p.x;p.py=p.y;p.age+=dt;p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  state.particles=state.particles.filter(p=>p.age<p.life);

  if(state.cue){
    state.cueAge+=dt;
    if(!state.cue.alive||state.cueAge>P.cueLife){
      if(state.cue) state.cue.alive=false;
      state.cue=null;state.canShoot=true;
    }
  }

  state.spawnAge+=dt;
  if(state.spawnAge>=R.spawnEvery){
    state.spawnAge-=R.spawnEvery;
    if(fruitCount()<R.maxFruit){
      const t=irand(0,2),r=radius(t);
      spawn(rand(WALL+r,720-WALL-r),CEILING-r-10,t,r);
    }
  }

  state.comboAge+=dt;
  if(state.comboAge>2.1){state.combo=Math.max(1,state.combo-dt*.8);}
  let danger=0;
  for(const b of state.balls)
    if(b.type>=0 && b.y-b.r<GAME.dangerY && Math.hypot(b.vx,b.vy)<250) danger++;
  state.dangerAge=danger>=R.dangerCount?state.dangerAge+dt:Math.max(0,state.dangerAge-dt*2);
  if(state.dangerAge>=R.dangerHold) state.gameOver=true;
}

function drawFrame(){
  const D=GM.draw,v=GM.viewport.visibleRoomRect;
  D.layer("Background");
  D.rect(v.x,v.y,v.x+v.width,v.y+v.height,{color:"#11131f"});
  D.rect(0,0,720,720,{color:"#09091a"});
  D.rect(0,GAME.floorY,720,720,{color:"#0a0a1a"});
  for(let y=CEILING;y<GAME.floorY;y+=48)
    D.line(WALL,y,720-WALL,y,{color:"#25294d",alpha:y%96?0.14:0.26,lineWidth:2});

  D.layer("World");
  D.line(WALL,GAME.dangerY,720-WALL,GAME.dangerY,{color:"#59233d",alpha:.7,lineWidth:3});

  D.layer("Launcher");
  D.line(0,GAME.floorY,720,GAME.floorY,{color:"#ff2244",lineWidth:4});
  D.line(296,GAME.cueY+36,424,GAME.cueY+36,{color:"#4e527d",lineWidth:4});
  if(state.canShoot&&!state.gameOver)
    D.spriteExt(ATLAS,"cue",360,GAME.cueY,{originX:.5,originY:.5});

  const alpha=clamp(GM.runtime.simulationAlpha,0,1);
  D.layer("Balls");
  for(const b of state.balls){
    const x=GM.math.lerp(b.px,b.x,alpha),y=GM.math.lerp(b.py,b.y,alpha);
    if(!Number.isFinite(x+y+b.r)) continue;
    D.spriteExt(ATLAS,"disc",x+4,Math.min(GAME.floorY+2,y+b.r*.84),{
      width:b.r*1.55,height:Math.max(8,b.r*.3),color:"#000000",alpha:.24
    });
    D.spriteExt(ATLAS,b.type<0?"cue":GAME.tiers[b.type].frame,x,y,{originX:.5,originY:.5});
  }

  D.layer("Effects");
  for(const p of state.particles){
    const life=1-p.age/p.life;
    D.spriteExt(ATLAS,"spark",GM.math.lerp(p.px,p.x,alpha),GM.math.lerp(p.py,p.y,alpha),{
      scale:.45+life*.6,color:p.color,alpha:life
    });
  }

  drawAim();

  D.layer("HUD");
  D.rect(0,0,720,GAME.hudHeight,{color:"#05050c",alpha:.42});
  D.line(0,GAME.hudHeight,720,GAME.hudHeight,{color:"#232347",alpha:.82,lineWidth:2});
  D.atlasText(FONT,"FRUIT SHOT",20,14,{scale:1.35,color:"#ffffff"});
  D.atlasText(FONT,`SCORE ${String(state.score|0).padStart(6,"0")}`,20,44,{scale:1,color:"#ffffff"});
  D.atlasText(FONT,`X${state.combo.toFixed(1)}`,700,44,{
    scale:1,color:state.combo>1.05?"#ffd166":"#8d92bd",align:"right"
  });
  D.atlasTextFit(FONT,state.canShoot?"CLICK OR TAP ANYWHERE":"CUE BALL ACTIVE",360,690,{
    maxWidth:500,scale:.9,minScale:.55,color:state.canShoot?"#b9bddb":"#ffd166",align:"center"
  });

  if(state.gameOver){
    D.rect(0,0,720,720,{color:"#000000",alpha:.7});
    D.atlasText(FONT,"BOARD FULL",360,280,{scale:2,color:"#ff718e",align:"center"});
    D.atlasText(FONT,`SCORE ${String(state.score|0).padStart(6,"0")}`,360,340,{scale:1.25,color:"#ffffff",align:"center"});
  }
}

function drawAim(){
  if(!state.aim.active||!state.canShoot||state.gameOver) return;
  const D=GM.draw,t=resolveShotTarget(state.aim.x,state.aim.y);
  let n=GM.math.normalize2(t.x-360,t.y-GAME.cueY),x=360,y=GAME.cueY,remain=620;
  D.layer("Aim");
  for(let bounce=0;bounce<4&&remain>0;bounce++){
    let wall=Infinity;
    if(n.x<-.001) wall=(WALL+GAME.launcher.cueRadius-x)/n.x;
    if(n.x>.001) wall=(720-WALL-GAME.launcher.cueRadius-x)/n.x;
    const travel=wall>0&&wall<remain?wall:remain;
    const x2=x+n.x*travel,y2=y+n.y*travel;
    D.line(x,y,x2,y2,{color:"#ffffff",alpha:.26,lineWidth:2});
    const dots=Math.floor(travel/30);
    for(let i=1;i<=dots;i++){
      const q=i/(dots+1);
      D.spriteExt(ATLAS,"aim-dot",x+(x2-x)*q,y+(y2-y)*q,{scale:.7,alpha:.88});
    }
    remain-=travel;x=x2;y=y2;
    if(travel===wall){n.x=-n.x;x+=n.x*.01;}else break;
  }
  D.spriteExt(ATLAS,"spark",x,y,{scale:.75,color:"#ffd166",alpha:.9});
}

function create(){
  GM.layer.stack(["Background","World","Balls","Effects","Launcher","Aim","HUD"],{start:-100,step:20});
  GM.layer.assertAbove("Aim","Launcher");
  installAssets();
  reset();
  status.hidden=true;
  proof.complete=true;
}

GM.app.start({
  parent:"game",
  viewport:{
    mode:"fixed",width:GAME.viewport.width,height:GAME.viewport.height,
    fit:"contain",scaleStep:.25,fitArea:"viewport",safeArea:"vertical",
    align:{
      portrait:{x:"center",y:"top"},
      landscape:{x:"center",y:"center"}
    }
  },
  simulationHz:60,maxFrameDeltaMs:100,maxCatchUpSteps:5,randomSeed:1337,
  renderQuality:"pixel-art",pixelArt:true,antialias:false,roundPixels:true,
  renderResolution:"auto",maxRenderResolution:3,
  stage:false,curtain:false,globals:false,drawValidation:"report",layerAssertions:true,
  background:"#11131f",
  create,step:(_gm,dt)=>step(dt),draw:drawFrame,
  ui(){
    if(!state.gameOver) return;
    GM.ui.buttonCenter(360,410,220,58,"PLAY AGAIN",reset,{
      id:"again",fill:"#ffd166",hoverFill:"#ffe39a",activeFill:"#e7a93e",
      color:"#17131f",radius:0,font:"monospace",size:18,shadow:false
    });
  },
  onError(error){
    const text=error instanceof Error?(error.stack||error.message):String(error);
    proof.errors.push(text);
    errorBox.hidden=false;
    errorBox.textContent=text;
  }
});
</script>
</body>
</html>
