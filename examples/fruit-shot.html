<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phaser 4 Facade Fruit Shot</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #073b4c;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #status, #proof-error {
            position: fixed;
            z-index: 10;
            left: 12px;
            right: 12px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
            pointer-events: none;
        }
        #status {
            top: 12px;
            color: #ffffff;
        }
        #proof-error {
            bottom: 12px;
            padding: 8px;
            color: #ffffff;
            background: #a4161a;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "phaser": "../node_modules/phaser/dist/phaser.esm.js"
        }
    }
    </script>
</head>
<body>
    <div id="status" role="status">Fruit Shot booting...</div>
    <div id="proof-error" role="alert" hidden></div>
    <div id="game"></div>
    <script type="module" src="./fruit-shot.js"></script>
</body>
</html>
